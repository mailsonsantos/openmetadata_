version: "3.8"

networks:
  openmetadata-net:
    driver: bridge

volumes:
  minio-data:
  hive-metastore-db-data:
  openmetadata-data:

services:

  # -----------------------------------------
  # MinIO (Object Storage)
  # -----------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - openmetadata-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------
  # Hive Metastore Database (PostgreSQL)
  # -----------------------------------------
  hive-metastore-db:
    image: postgres:15-alpine
    container_name: hive-metastore-db
    environment:
      POSTGRES_DB: ${HIVE_METASTORE_DB_NAME:-metastore}
      POSTGRES_USER: ${HIVE_METASTORE_DB_USER:-hive}
      POSTGRES_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:-hive}
    volumes:
      - hive-metastore-db-data:/var/lib/postgresql/data
    networks:
      - openmetadata-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HIVE_METASTORE_DB_USER:-hive} -d ${HIVE_METASTORE_DB_NAME:-metastore}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -----------------------------------------
  # Hive Metastore
  # -----------------------------------------
  hive-metastore:
    image: starburstdata/hive:3.1.2-e.18
    container_name: hive-metastore
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://${HIVE_METASTORE_DB_HOST:-hive-metastore-db}:${HIVE_METASTORE_DB_PORT:-5432}/${HIVE_METASTORE_DB_NAME:-metastore}
      HIVE_METASTORE_USER: ${HIVE_METASTORE_DB_USER:-hive}
      HIVE_METASTORE_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:-hive}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_PATH_STYLE_ACCESS: "true"
    ports:
      - "9083:9083"
    networks:
      - openmetadata-net
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9083 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------
  # Trino
  # -----------------------------------------
  trino:
    image: trinodb/trino:435
    container_name: trino
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./init-trino/catalog:/etc/trino/catalog
    networks:
      - openmetadata-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------
  # OpenMetadata Dependencies
  # -----------------------------------------
  openmetadata-db:
    image: postgres:15-alpine
    container_name: openmetadata-db
    environment:
      POSTGRES_DB: openmetadata_db
      POSTGRES_USER: openmetadata_user
      POSTGRES_PASSWORD: openmetadata_password
    volumes:
      - openmetadata-data:/var/lib/postgresql/data
    networks:
      - openmetadata-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openmetadata_user -d openmetadata_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    networks:
      - openmetadata-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  # -----------------------------------------
  # OpenMetadata Server
  # -----------------------------------------
  openmetadata-server:
    image: openmetadata/server:1.3.4
    container_name: openmetadata-server
    depends_on:
      openmetadata-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USE_SSL: "false"
      DB_HOST: openmetadata-db
      DB_PORT: 5432
      OM_DATABASE: openmetadata_db
      DB_USER: openmetadata_user
      DB_USER_PASSWORD: openmetadata_password
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      SERVER_PORT: 8585
      SERVER_ADMIN_PORT: 8586
      AUTHENTICATION_PROVIDER: basic
    ports:
      - "8585:8585"
      - "8586:8586"
    networks:
      - openmetadata-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8585/api/v1/system/version"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 120s

  # -----------------------------------------
  # MinIO Bucket Setup (one-shot)
  # -----------------------------------------
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./init-minio/setup.sh:/setup.sh
    entrypoint: ["/bin/sh", "/setup.sh"]
    networks:
      - openmetadata-net
    restart: on-failure

  # -----------------------------------------
  # Spark App (ephemeral data generation)
  # -----------------------------------------
  spark-app:
    image: bitnami/spark:3.5.1
    container_name: spark-app
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      NUM_ROWS: "1000"
    volumes:
      - ../src/spark:/app
    working_dir: /app
    command: >
      bash -c "
        pip install --quiet -r requirements.txt &&
        spark-submit
          --master local[*]
          --packages org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
          generate_synthetic_data.py
      "
    networks:
      - openmetadata-net
    profiles:
      - spark
