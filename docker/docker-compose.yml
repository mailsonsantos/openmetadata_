version: "3.8"

networks:
  openmetadata-net:
    driver: bridge

volumes:
  minio-data:
  hive-metastore-db-data:
  openmetadata-data:

services:

  # -----------------------------------------
  # MinIO (Object Storage)
  # -----------------------------------------
  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - openmetadata-net
    mem_limit: ${MEM_MINIO:-512m}
    cpus: ${CPUS_MINIO:-1.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -----------------------------------------
  # Hive Metastore Database (PostgreSQL)
  # -----------------------------------------
  hive-metastore-db:
    image: postgres:15-alpine
    container_name: hive-metastore-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${HIVE_METASTORE_DB_NAME:-metastore}
      POSTGRES_USER: ${HIVE_METASTORE_DB_USER:-hive}
      POSTGRES_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:-hive}
    volumes:
      - hive-metastore-db-data:/var/lib/postgresql/data
    networks:
      - openmetadata-net
    mem_limit: ${MEM_HIVE_METASTORE_DB:-256m}
    cpus: ${CPUS_HIVE_METASTORE_DB:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${HIVE_METASTORE_DB_USER:-hive} -d ${HIVE_METASTORE_DB_NAME:-metastore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # -----------------------------------------
  # Hive Metastore
  # -----------------------------------------
  hive-metastore:
    image: starburstdata/hive:3.1.2-e.18
    container_name: hive-metastore
    restart: unless-stopped
    depends_on:
      hive-metastore-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      HIVE_METASTORE_DRIVER: org.postgresql.Driver
      HIVE_METASTORE_JDBC_URL: jdbc:postgresql://${HIVE_METASTORE_DB_HOST:-hive-metastore-db}:${HIVE_METASTORE_DB_PORT:-5432}/${HIVE_METASTORE_DB_NAME:-metastore}
      HIVE_METASTORE_USER: ${HIVE_METASTORE_DB_USER:-hive}
      HIVE_METASTORE_PASSWORD: ${HIVE_METASTORE_DB_PASSWORD:-hive}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_PATH_STYLE_ACCESS: "true"
      JAVA_TOOL_OPTIONS: "-Xmx${HIVE_METASTORE_HEAP_SIZE:-512m}"
    ports:
      - "9083:9083"
    networks:
      - openmetadata-net
    mem_limit: ${MEM_HIVE_METASTORE:-1g}
    cpus: ${CPUS_HIVE_METASTORE:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9083' 2>/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # -----------------------------------------
  # Trino
  # -----------------------------------------
  trino:
    image: trinodb/trino:435
    container_name: trino
    restart: unless-stopped
    depends_on:
      hive-metastore:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx${TRINO_HEAP_SIZE:-1g} -Xms256m"
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
    entrypoint: >
      /bin/bash -c "
        envsubst < /etc/trino/catalog/minio.properties.template > /etc/trino/catalog/minio.properties &&
        exec /usr/lib/trino/bin/run-trino
      "
    ports:
      - "8080:8080"
    volumes:
      - ./init-trino/catalog/minio.properties.template:/etc/trino/catalog/minio.properties.template:ro
    networks:
      - openmetadata-net
    mem_limit: ${MEM_TRINO:-2g}
    cpus: ${CPUS_TRINO:-2.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/info"]
      interval: 15s
      timeout: 10s
      retries: 15
      start_period: 90s

  # -----------------------------------------
  # OpenMetadata Dependencies
  # -----------------------------------------
  openmetadata-db:
    image: postgres:15-alpine
    container_name: openmetadata-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${OM_DB_NAME:-openmetadata_db}
      POSTGRES_USER: ${OM_DB_USER:-openmetadata_user}
      POSTGRES_PASSWORD: ${OM_DB_PASSWORD:-openmetadata_password}
    volumes:
      - openmetadata-data:/var/lib/postgresql/data
    networks:
      - openmetadata-net
    mem_limit: ${MEM_OM_DB:-256m}
    cpus: ${CPUS_OM_DB:-0.5}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OM_DB_USER:-openmetadata_user} -d ${OM_DB_NAME:-openmetadata_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.10.2
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms${ES_HEAP_SIZE:-512m} -Xmx${ES_HEAP_SIZE:-512m}
    ports:
      - "9200:9200"
    networks:
      - openmetadata-net
    mem_limit: ${MEM_ELASTICSEARCH:-1g}
    cpus: ${CPUS_ELASTICSEARCH:-1.0}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 90s

  # -----------------------------------------
  # OpenMetadata Server
  # -----------------------------------------
  openmetadata-server:
    image: openmetadata/server:1.3.4
    container_name: openmetadata-server
    restart: unless-stopped
    depends_on:
      openmetadata-db:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    env_file:
      - ./.env
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx${OM_HEAP_SIZE:-1g} -Xms256m"
      DB_DRIVER_CLASS: org.postgresql.Driver
      DB_SCHEME: postgresql
      DB_USE_SSL: "false"
      DB_HOST: ${OM_DB_HOST:-openmetadata-db}
      DB_PORT: ${OM_DB_PORT:-5432}
      OM_DATABASE: ${OM_DB_NAME:-openmetadata_db}
      DB_USER: ${OM_DB_USER:-openmetadata_user}
      DB_USER_PASSWORD: ${OM_DB_PASSWORD:-openmetadata_password}
      ELASTICSEARCH_HOST: elasticsearch
      ELASTICSEARCH_PORT: 9200
      ELASTICSEARCH_SCHEME: http
      SERVER_PORT: 8585
      SERVER_ADMIN_PORT: 8586
      AUTHENTICATION_PROVIDER: basic
    ports:
      - "8585:8585"
      - "8586:8586"
    networks:
      - openmetadata-net
    mem_limit: ${MEM_OM_SERVER:-1500m}
    cpus: ${CPUS_OM_SERVER:-2.0}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8585/api/v1/system/version"]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 180s

  # -----------------------------------------
  # MinIO Bucket Setup (one-shot)
  # -----------------------------------------
  minio-setup:
    image: minio/mc:latest
    container_name: minio-setup
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./init-minio/setup.sh:/setup.sh
    entrypoint: ["/bin/sh", "/setup.sh"]
    networks:
      - openmetadata-net
    mem_limit: ${MEM_MINIO_SETUP:-64m}
    cpus: ${CPUS_MINIO_SETUP:-0.25}
    restart: on-failure

  # -----------------------------------------
  # Spark App (ephemeral — geração de dados sintéticos)
  # Executar a partir do diretório docker/:
  #   docker compose --profile spark up spark-app
  # -----------------------------------------
  spark-app:
    image: bitnami/spark:3.5.1
    container_name: spark-app
    restart: "no"
    depends_on:
      minio-setup:
        condition: service_completed_successfully
      hive-metastore:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-minioadmin}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      HIVE_METASTORE_URI: thrift://hive-metastore:9083
      NUM_ROWS: ${NUM_ROWS:-1000}
    volumes:
      - ../src/spark:/app
    working_dir: /app
    command: >
      bash -c "
        pip install --quiet -r requirements.txt &&
        spark-submit
          --master local[*]
          --packages org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262
          generate_synthetic_data.py
      "
    networks:
      - openmetadata-net
    mem_limit: ${MEM_SPARK:-2g}
    cpus: ${CPUS_SPARK:-4.0}
    profiles:
      - spark
